services:
  laravel_app:
    build:
      context: .
      network: host
    container_name: laravel_app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/apache/laravel.conf:/etc/apache2/conf-enabled/laravel.conf:ro
    depends_on:
      - mysql_db
      - searxng
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama.host:11434}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui.host:8188}
    command:
      - bash
      - -c
      - |
        set -e
        APP_UID="$${APP_UID:-1000}"
        APP_GID="$${APP_GID:-1000}"
        WEB_USER=laravel
        mkdir -p storage/app/public/featured-images storage/framework/{cache,sessions,views} bootstrap/cache storage/logs
        if ! getent group "$${WEB_USER}" >/dev/null 2>&1; then
          groupadd -g "$${APP_GID}" "$${WEB_USER}" 2>/dev/null || groupadd "$${WEB_USER}"
        fi
        if ! id -u "$${WEB_USER}" >/dev/null 2>&1; then
          useradd -u "$${APP_UID}" -g "$${WEB_USER}" -s /sbin/nologin "$${WEB_USER}" 2>/dev/null || useradd -g "$${WEB_USER}" -s /sbin/nologin "$${WEB_USER}"
        fi
        chown -R "$${WEB_USER}:$${WEB_USER}" storage bootstrap/cache
        chmod -R ug+rwX storage/app/public/featured-images
        export APACHE_RUN_USER="$${WEB_USER}"
        export APACHE_RUN_GROUP="$${WEB_USER}"
        exec apache2-foreground
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "ollama.host:${OLLAMA_HOST_IP:-172.31.193.25}"
      - "comfyui.host:${COMFYUI_HOST_IP:-172.31.193.25}"

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anime
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql_db

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
