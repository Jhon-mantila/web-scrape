version: '3.8'

services:
  laravel_app:
    build: .
    container_name: laravel_app
    user: "${UID}:${GID}"
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql_db
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama.host:11434}
    # host.docker.internal → Docker Desktop (Windows). Ollama en WSL usa ollama.host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "ollama.host:${OLLAMA_HOST_IP:-172.31.193.25}"

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anime
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql_db